# median_stats_builder_config.yaml
#
# Config for median_stats_builder.py. Loaded automatically from the
# same directory as the script (or pass --config to point elsewhere).

paths:
  # Where the existing pipeline writes its CSVs. Read-only for this
  # script -- nothing here is ever modified.
  csv_dir: "/home/ukronis/JSONExtract/chronogenesis_JSON_retriever_umalliance_v3/CSV/Global_Leaderboard"
  mid_pack_csv: "998-median_mid-pack_live_resorted.csv"
  floor_csv: "999-median_floor_live_resorted.csv"

  # A SEPARATE cloned copy of the raw-data repo (not the same folder
  # as csv_dir above). The script writes the output JSON here and
  # commits/pushes it.
  output_repo_dir: "~/JSONExtract/umamoe_process_CSV_to_JSON/raw-data"
  output_json_name: "median_stats.json"

# Date range to include in the output JSON. Uses (month, date) pairs
# matched against the CSV's own column headers -- not calendar
# arithmetic -- so this works correctly regardless of year, since the
# CSV's columns are already stored in chronological order.
#
# Leave ALL FOUR blank to auto-include every column found in the CSV
# (earliest through latest available). If you set some but not others,
# missing start_* defaults to earliest available, missing end_*
# defaults to latest available.
range:
  start_month:
  start_date:
  end_month:
  end_date:

git:
  commit_message: "Update median stats"
  branch: "main"
